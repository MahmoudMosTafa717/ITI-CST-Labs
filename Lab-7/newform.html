<!-- Mistakes
Wrong element ID
diplayBtn -> displayBtn.
Functions not in global scope
onload()
eraseVal Empty function
multiple options select
. -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form Elements</title>

    <script>
      window.onload = function () {
        var inputField = document.getElementById("txt1");

        document.getElementById("displayBtn").value = "Display Options";

        window.displayNum = function (elem) {
          inputField.value += elem.value.trim();
        };

        window.eraseVal = function () {
          inputField.value = inputField.value.slice(0, -1);
        };

        window.displayOptions = function () {
          var sel = document.getElementById("menu");
          let selectedOptions = [];

          for (let option of sel.options) {
            if (option.selected) {
              selectedOptions.push(option.text);
            }
          }

          console.log(selectedOptions.join(", "));
        };

        window.displayContent = function (txtField) {
          document.getElementById("div1id").textContent = txtField.value;
        };
      };
    </script>
  </head>

  <body>
    <a href="#" onclick="alert('anchor tag'); return false;">google</a>

    <br /><br />

    <input type="button" value=" 1 " onclick="displayNum(this)" />
    <input type="button" value=" 2 " onclick="displayNum(this)" />
    <input type="button" value=" 3 " onclick="displayNum(this)" />
    <input type="button" value=" 4 " onclick="displayNum(this)" />
    <input type="button" value=" 5 " onclick="displayNum(this)" />
    <input type="button" value=" 6 " onclick="displayNum(this)" />
    <input type="button" value=" 7 " onclick="displayNum(this)" />

    <input type="text" id="txt1" />

    <input type="button" value=" C " onclick="txt1.value=''" />

    <input type="button" value=" << " onclick="eraseVal()" />

    <br /><br />

    <select id="menu" multiple size="4">
      <option>option#1</option>
      <option>option#2</option>
      <option>option#3</option>
      <option value="o4">option#4</option>
      <option>option#5</option>
    </select>

    <input
      type="button"
      id="displayBtn"
      value="Display Options"
      onclick="displayOptions()"
    />

    <br /><br />

    <input
      type="text"
      onfocus="this.select()"
      onchange="displayContent(this)"
    />

    <div id="div1id"></div>
  </body>
</html>
